services:
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    # Postgres only reachable inside Docker network (not exposed to internet)
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: yourlawyer_redis
    restart: always
    # No host ports â€” internal Docker network only
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  your-lowyer-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yourLawyer_fastapi_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-${YOURLAWYER_OPENAI_API_KEY:-}}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_PORT=5432
      - POSTGRES_SERVER=db
      - PORT=5000
      - ROOT_PATH=/backend
      - CHROMA_DB_DIR=/app/storage/chroma
      - HF_HOME=/app/storage/huggingface
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-30}
      - IP_WHITELIST_ENABLED=${IP_WHITELIST_ENABLED:-false}
      - ALLOWED_IPS=${ALLOWED_IPS:-127.0.0.1,172.17.0.0/16,172.18.0.0/16,172.19.0.0/16}
      - OTP_SECRET=${OTP_SECRET}
      - OTP_API_KEY=${OTP_API_KEY}
      - OTP_TEMPLATE_ID=${OTP_TEMPLATE_ID}
      - OTP_URL=${OTP_URL:-https://api.sms.ir/v1/send/verify}
      - ADMIN_MOBILES=${ADMIN_MOBILES:-}
      - DOCS_ENABLED=${DOCS_ENABLED:-false}
      - REDIS_URL=redis://redis:6379/0
      - REDIS_ENABLED=${REDIS_ENABLED:-true}
      - QUOTA_ENABLED=${QUOTA_ENABLED:-true}
      - QUOTA_FAIL_CLOSED=${QUOTA_FAIL_CLOSED:-true}
      - FREE_MONTHLY_QUESTION_CAP=${FREE_MONTHLY_QUESTION_CAP:-5}
      - FREE_USER_MONTHLY_COST_CAP=${FREE_USER_MONTHLY_COST_CAP:-0.08}
      - SYSTEM_FREE_MONTHLY_CAP=${SYSTEM_FREE_MONTHLY_CAP:-18.0}
      - PAID_SILVER_MONTHLY_COST_CAP=${PAID_SILVER_MONTHLY_COST_CAP:-1.5}
      - PAID_GOLD_MONTHLY_COST_CAP=${PAID_GOLD_MONTHLY_COST_CAP:-4.0}
      - SYSTEM_FREE_WARN_RATIO=${SYSTEM_FREE_WARN_RATIO:-0.8}
      - QUOTA_DEFAULT_GLOBAL_USD=${QUOTA_DEFAULT_GLOBAL_USD:-18}
      - QUOTA_DEFAULT_USER_USD=${QUOTA_DEFAULT_USER_USD:-0.08}
      - DEFAULT_LLM_MODEL=${DEFAULT_LLM_MODEL:-gpt-4o-mini}
    expose:
      - "5000"
    volumes:
      - ./data:/app/data
      - ./storage/chroma:/app/storage/chroma
      - ./storage/models:/app/storage/models
      - ./storage/huggingface:/app/storage/huggingface
    networks:
      - app-network

  your-lowyer-frontend:
    build:
      context: ../your-lowyer-frontEnd
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEW_NEXT_PUBLIC_API_URL:-https://yourlawyeer.ir/backend}
    container_name: your-lowyer-frontEnd
    restart: always
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - NEXT_PUBLIC_API_URL=${NEW_NEXT_PUBLIC_API_URL:-https://yourlawyeer.ir/backend}
      # Server Actions call backend on Docker network (not public nginx)
      - API_URL=${API_URL:-http://your-lowyer-backend:5000}
      - JWT_SERVER_SECRET=${JWT_SERVER_SECRET}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
    expose:
      - "8000"
    depends_on:
      - your-lowyer-backend
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - your-lowyer-frontend
      - your-lowyer-backend
    networks:
      - app-network
      - shared-proxy-network

networks:
  app-network:
    driver: bridge
  shared-proxy-network:
    external: true

volumes:
  db_data:
  redis_data:
