services:
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    # Postgres only reachable inside Docker network (not exposed to internet)
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  your-lowyer-backend:
    build:
      context: ../yourlawyer-backend
      dockerfile: Dockerfile
    container_name: yourLawyer_fastapi_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Prefer OPENAI_API_KEY; YOURLAWYER_OPENAI_API_KEY kept as alias
      - OPENAI_API_KEY=${OPENAI_API_KEY:-${YOURLAWYER_OPENAI_API_KEY:-}}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_PORT=5432
      - POSTGRES_SERVER=db
      - PORT=5000
      - ROOT_PATH=/backend
      - CHROMA_DB_DIR=/app/storage/chroma
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-30}
      - IP_WHITELIST_ENABLED=${IP_WHITELIST_ENABLED:-false}
      - ALLOWED_IPS=${ALLOWED_IPS:-127.0.0.1,172.17.0.0/16,172.18.0.0/16,172.19.0.0/16}
      - OTP_SECRET=${OTP_SECRET}
      - OTP_API_KEY=${OTP_API_KEY}
      - OTP_TEMPLATE_ID=${OTP_TEMPLATE_ID}
      - OTP_URL=${OTP_URL:-https://api.sms.ir/v1/send/verify}
      - PLAN_ADMIN_SECRET=${PLAN_ADMIN_SECRET:-}
    expose:
      - "5000"
    volumes:
      - ../yourlawyer-backend/data:/app/data
      - ../yourlawyer-backend/storage/chroma:/app/storage/chroma
      - ../yourlawyer-backend/storage/models:/app/storage/models
    networks:
      - app-network

  your-lowyer-frontend:
    build:
      context: ../your-lowyer-frontEnd
      dockerfile: Dockerfile
      args:
        # Public URL for browser / client bundle (via nginx)
        - NEXT_PUBLIC_API_URL=${NEW_NEXT_PUBLIC_API_URL:-http://yourlawyeer.ir/backend}
    container_name: your-lowyer-frontEnd
    restart: always
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - NEXT_PUBLIC_API_URL=${NEW_NEXT_PUBLIC_API_URL:-http://yourlawyeer.ir/backend}
      # Server Actions must call backend on Docker network (not through public nginx)
      - API_URL=${API_URL:-http://your-lowyer-backend:5000}
      - JWT_SERVER_SECRET=${JWT_SERVER_SECRET}
    expose:
      - "8000"
    depends_on:
      - your-lowyer-backend
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - your-lowyer-frontend
      - your-lowyer-backend
    networks:
      - app-network

volumes:
  db_data:

networks:
  app-network:
    driver: bridge
