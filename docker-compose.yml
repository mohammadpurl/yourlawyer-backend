version: '3.9'

services:
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"  # برای تست محلی، بعداً می‌تونی حذف کنی
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  your-lowyer-backend:
    build:
      context: ../your-lowyer-backEnd
      dockerfile: Dockerfile
    container_name: yourLawyer_fastapi_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - OPENAI_API_KEY=${YOURLAWYER_OPENAI_API_KEY}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_PORT=5432
      - POSTGRES_SERVER=db
      - PORT=5000
      - ROOT_PATH=/backend
      - CHROMA_DB_DIR=/app/storage/chroma
      - IP_WHITELIST_ENABLED=${IP_WHITELIST_ENABLED:-true}
      - ALLOWED_IPS=${ALLOWED_IPS:-37.59.183.158,127.0.0.1,localhost}
    expose:
      - "5000"
    volumes:
      - ../your-lowyer-backEnd/data:/app/data
      - chroma_data:/app/storage/chroma
    networks:
      - app-network

  your-lowyer-frontend:
    build:
      context: ../your-lowyer-frontEnd
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEW_NEXT_PUBLIC_API_URL}
    container_name: your-lowyer-frontEnd
    restart: always
    environment:
      - NODE_ENV=${NODE_ENV}
      - NEXT_PUBLIC_API_URL=${NEW_NEXT_PUBLIC_API_URL}
      - JWT_SERVER_SECRET=${JWT_SERVER_SECRET}
    expose:
      - "8000"
    depends_on:
      - your-lowyer-backend
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - your-lowyer-frontend
      - your-lowyer-backend
    networks:
      - app-network

volumes:
  db_data:
  chroma_data:

networks:
  app-network:
    driver: bridge
